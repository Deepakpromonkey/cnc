# TLS via Let's Encrypt (certbot webroot at /var/www/certbot). Spec §2, §13 phase 8.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# HTTP → HTTPS, and ACME challenges.
server {
  listen 80;
  server_name app.coffeeandcreative.in sarpanch.agencylife.in paltan.agencylife.in badelog.agencylife.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://app.coffeeandcreative.in$request_uri; }
}

# Old portals (Sarpanch, Paltan, Badelog) → the one login.
server {
  listen 443 ssl;
  http2 on;
  server_name sarpanch.agencylife.in paltan.agencylife.in badelog.agencylife.in;
  ssl_certificate     /etc/letsencrypt/live/agencylife.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/agencylife.in/privkey.pem;
  return 301 https://app.coffeeandcreative.in/login;
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.coffeeandcreative.in;
  ssl_certificate     /etc/letsencrypt/live/app.coffeeandcreative.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.coffeeandcreative.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 60m; # several 10 MB images per form

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Sign-in is a server action posted to /login.
  location = /login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://web:3040;
  }
  # Razorpay retries webhooks; don't throttle them.
  location = /api/razorpay/webhook { proxy_pass http://web:3040; }
  location /api/ {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://web:3040;
  }
  location / { proxy_pass http://web:3040; }
}
