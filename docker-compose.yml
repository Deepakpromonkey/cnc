# Production on ProMonkey's VPS (spec §2). Secrets come from .env (never committed).
services:
  web:
    build: { context: ., target: web }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cnc:${POSTGRES_PASSWORD}@postgres:5432/cnc_crm?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /var/cnc/uploads
    volumes: [uploads:/var/cnc/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  migrate:
    build: { context: ., target: deps }
    command: npx prisma migrate deploy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cnc:${POSTGRES_PASSWORD}@postgres:5432/cnc_crm?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cnc:${POSTGRES_PASSWORD}@postgres:5432/cnc_crm?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /var/cnc/uploads
    volumes: [uploads:/var/cnc/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cnc_crm
      POSTGRES_USER: cnc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnc -d cnc_crm"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
